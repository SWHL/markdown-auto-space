name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-upload-vsix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: pnpm

      - name: Set package version from tag in CI workspace
        run: pnpm version:set -- "${GITHUB_REF_NAME}"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check release version metadata
        run: pnpm version:check -- "${GITHUB_REF_NAME}"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build desktop
        run: pnpm build

      - name: Build web
        run: pnpm build:web

      - name: Package VSIX
        run: pnpm package:vsix

      - name: Extract changelog for release
        run: node scripts/generate-release-notes.mjs "${GITHUB_REF_NAME}" > release-notes.md

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package-${{ github.ref_name }}
          path: "*.vsix"

      - name: Create or update draft release with VSIX
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          body_path: release-notes.md
          overwrite_files: true
          files: "*.vsix"
